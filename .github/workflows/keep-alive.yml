name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 9 */3 * *'   # Ogni 3 giorni alle 9:00 UTC
  workflow_dispatch:          # Trigger manuale dalla dashboard GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://atenfxxmdfthtvcprxqe.supabase.co/rest/v1/newsletter_subscribers?select=count&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: Supabase returned $STATUS"
          fi
